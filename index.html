<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFC Visit Card</title>
<style>
body{margin:0;background:#f3f4f6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111}
.card{max-width:430px;margin:40px auto;padding:28px;background:white;border-radius:28px;box-shadow:0 12px 40px #0001;text-align:center}
.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#ddd}
h1{margin:18px 0 4px}.sub{color:#666;margin-bottom:24px}
a{display:block;text-decoration:none;color:#111;background:#f1f1f1;padding:15px;margin:10px 0;border-radius:15px;font-weight:600}
.save{background:#111;color:#fff}
small{display:block;color:#888;margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <img class="avatar" src="avatar.jpg" alt="Avatar">
  <h1>YOUR NAME</h1>
  <div class="sub">NFC Visit Card</div>
  <a class="save" href="contact.vcf" download>Lưu liên hệ</a>
  <a href="https://facebook.com/YOUR_USERNAME">Facebook</a>
  <a href="https://instagram.com/YOUR_USERNAME">Instagram</a>
  <a href="https://www.tiktok.com/@YOUR_USERNAME">TikTok</a>
  <a href="https://github.com/YOUR_USERNAME">GitHub</a>
  <small>Chạm NFC để mở card</small>
</div>
</body>
</html>
